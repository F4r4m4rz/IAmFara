name: Deploy to Production (SmarterASP.NET)

on:
  push:
    branches: ["main"]

jobs:
  # Runs before `deploy` so schema changes are always in place before the new
  # app code that depends on them goes live — merging (and thus approving)
  # the PR is the explicit approval for this; there's no separate manual gate.
  # `dotnet ef database update` only applies migrations not already recorded
  # in `__EFMigrationsHistory`, so this is a safe no-op when there's nothing
  # pending.
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install EF Core CLI tool
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Apply pending migrations (Analytics)
        working-directory: src/backend/IAmFara.Web
        env:
          CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING_PROD }}
        run: dotnet ef database update --context AnalyticsDbContext --connection "$CONNECTION_STRING"

      # Same physical database as AnalyticsDbContext above (schema-separated),
      # but its migrations live in IAmFara.Data.SqlServer, not IAmFara.Web.
      - name: Apply pending migrations (Identity)
        working-directory: src/backend/IAmFara.Web
        env:
          CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING_PROD }}
        run: >
          dotnet ef database update --context IdentityDbContext
          --project ../IAmFara.Data.SqlServer/IAmFara.Data.SqlServer.csproj
          --connection "$CONNECTION_STRING"

      # Same physical database again ("finance" schema).
      - name: Apply pending migrations (Finance)
        working-directory: src/backend/IAmFara.Web
        env:
          CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING_PROD }}
        run: >
          dotnet ef database update --context FinanceDbContext
          --project ../IAmFara.Data.SqlServer/IAmFara.Data.SqlServer.csproj
          --connection "$CONNECTION_STRING"

  deploy:
    needs: migrate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      # Vite writes its build output directly into src/backend/IAmFara.Web/wwwroot
      # (see src/frontend/vite.config.ts), so this must run before dotnet publish.
      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish and deploy backend via Web Deploy
        working-directory: src/backend/IAmFara.Web
        run: >
          dotnet build IAmFara.Web.csproj -c Release
          /p:DeployOnBuild=true
          /p:DeployDefaultTarget=WebPublish
          /p:WebPublishMethod=MSDeploy
          /p:MSDeployPublishMethod=WMSVC
          /p:MSDeployServiceURL=https://${{ secrets.PROD_SERVER }}:8172/msdeploy.axd?site=${{ secrets.PROD_SITENAME }}
          /p:DeployIisAppPath=${{ secrets.PROD_SITENAME }}
          /p:UserName=${{ secrets.PROD_USERNAME }}
          /p:Password=${{ secrets.PROD_PASSWORD }}
          /p:AllowUntrustedCertificate=True
          "/p:WebConfigEnvironmentVariables=Resend__FromEmail=${{ secrets.RESEND_FROM_EMAIL }}%3BContact__ToEmail=${{ secrets.CONTACT_TO_EMAIL }}"
